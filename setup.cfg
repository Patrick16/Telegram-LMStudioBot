[flake8]
max-line-length = 100
per-file-ignores =
    __init__.py:F401
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    dist,
    build

[tool:black]
line-length = 100

[mypy]
python_version = 3.11
ignore_missing_imports = True
warn_unused_ignores = True

# python-telegram-bot types most Update fields as Optional; handlers are owner-gated and
# always receive a message, so these checks are noise there.
[mypy-src.bot.handlers.*]
disable_error_code = union-attr, arg-type, attr-defined, index

[mypy-src.bot.main]
disable_error_code = call-arg
